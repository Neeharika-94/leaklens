services:
  - type: web
    name: leaklens
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:application --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: JWT_SECRET, generateValue: true}
      - {key: DEMO_MCP_TOKEN, generateValue: true}
